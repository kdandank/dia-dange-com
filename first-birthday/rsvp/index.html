<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP — Dia's First Birthday</title>
  <meta name="description" content="See who's coming to Dia Dange's first birthday — One-der the Sea!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --coral:   #ff7b6b;
      --lavender:#9b72cf;
      --dark:    #1a3a6e;
      --card:    #ffffff;
    }

    html, body {
      min-height: 100%;
      font-family: 'Pacifico', cursive;
      color: var(--dark);
    }

    body {
      background:
        radial-gradient(ellipse at 30% 15%, rgba(168,218,220,0.45) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 85%, rgba(255,180,194,0.3)  0%, transparent 55%),
        linear-gradient(160deg, #e8f7f8 0%, #f5e6ff 50%, #e0f4f4 100%);
      background-attachment: fixed;
    }

    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      animation: twinkle ease-in-out infinite;
      opacity: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0;    transform: scale(0.5) rotate(0deg); }
      50%       { opacity: 0.55; transform: scale(1)   rotate(20deg); }
    }

    .page {
      min-height: 100svh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 4rem;
      position: relative;
      z-index: 1;
    }

    .rsvp-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .rsvp-header h1 {
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      color: var(--dark);
      line-height: 1.25;
    }
    .rsvp-header h1 em {
      color: var(--coral);
      font-style: normal;
    }

    .rsvp-header p {
      font-size: clamp(0.75rem, 2.8vw, 0.9rem);
      color: var(--lavender);
      margin-top: 0.5rem;
      letter-spacing: 0.06em;
    }

    .rsvp-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 520px;
    }

    .rsvp-card {
      background: var(--card);
      border-radius: 20px;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 4px 24px rgba(126,203,202,0.18);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .rsvp-card-name {
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: var(--dark);
    }

    .rsvp-card-meta {
      font-size: clamp(0.65rem, 2.2vw, 0.75rem);
      color: var(--coral);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .rsvp-card-message {
      font-size: clamp(0.82rem, 3vw, 0.95rem);
      color: #555;
      line-height: 1.6;
      border-left: 3px solid rgba(155,114,207,0.3);
      padding-left: 0.75rem;
      margin-top: 0.25rem;
    }

    .loading, .empty-state {
      text-align: center;
      color: var(--lavender);
      font-size: clamp(0.85rem, 3vw, 1rem);
      padding: 3rem 1rem;
    }

    .count-badge {
      background: var(--coral);
      color: white;
      border-radius: 50px;
      padding: 0.3rem 1rem;
      font-size: clamp(0.7rem, 2.5vw, 0.82rem);
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      background: var(--lavender);
      color: white;
      font-family: 'Pacifico', cursive;
      font-size: clamp(0.75rem, 3vw, 0.88rem);
      text-decoration: none;
      box-shadow: 0 4px 0 #7a54a8;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .back-link:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 #7a54a8; }
    .back-link:active { transform: translateY(2px);  box-shadow: 0 2px 0 #7a54a8; }

    /* ── Floating critters ── */
    .critter {
      position: absolute;
      animation: float ease-in-out infinite;
      pointer-events: none;
      user-select: none;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
    }
    @media (max-width: 480px) {
      .critter.hide-mobile { display: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0)     rotate(-5deg); }
      50%       { transform: translateY(-14px) rotate(5deg); }
    }

    .footer-row {
      text-align: center;
      margin-top: 2rem;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      letter-spacing: 0.25em;
      opacity: 0.45;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div id="sparkles"></div>

<main class="page">
  <span class="critter" style="top:6%;left:3%;animation-duration:4s">🐠</span>
  <span class="critter" style="top:8%;right:4%;animation-duration:5.2s;animation-delay:1s">🧜‍♀️</span>
  <span class="critter" style="bottom:12%;left:4%;animation-duration:6s;animation-delay:2s">🐡</span>
  <span class="critter" style="bottom:10%;right:3%;animation-duration:4.8s;animation-delay:1.5s">🐙</span>
  <span class="critter hide-mobile" style="top:30%;left:2%;animation-duration:5s;animation-delay:.5s">🐚</span>
  <span class="critter hide-mobile" style="top:35%;right:2%;animation-duration:4.5s;animation-delay:2.5s">⭐</span>

  <div class="rsvp-header">
    <span style="font-size:clamp(1.3rem,5vw,2rem);letter-spacing:0.2em;display:block;margin-bottom:0.8rem">🧜‍♀️ 🐠 🌊 🐚 ⭐</span>
    <h1>You're <em>Coming!</em></h1>
    <p>Everyone who RSVPd to Dia's big day</p>
  </div>

  <div id="count-wrap"></div>

  <div class="rsvp-grid" id="rsvp-grid">
    <div class="loading">Loading guests… 🐠</div>
  </div>

  <a href="../" class="back-link">🐚 Back to Invite</a>

  <div class="footer-row">🐠 🌟 🐚 🪸 🐡 🦀 🌊</div>

</main>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkdNxF7yoooyBmgwkUvOU3EWtj02366-l2MTQq2H_gEjqwTPaRcRoh0GuJiVF_yVsA/exec';

  const grid = document.getElementById('rsvp-grid');
  const countWrap = document.getElementById('count-wrap');

  fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(rows => {
      const attending = rows.filter(r => r.attending === 'yes');

      if (attending.length === 0) {
        grid.innerHTML = '<div class="empty-state">No RSVPs yet — be the first! 🌊</div>';
        return;
      }


      grid.innerHTML = attending.map(r => `
        <div class="rsvp-card">
          <div class="rsvp-card-name">${escapeHtml(r.name)}</div>
          ${r.plusOnes > 0 ? `<div class="rsvp-card-meta">+ ${r.plusOnes} guest${r.plusOnes > 1 ? 's' : ''}</div>` : ''}
          ${r.message ? `<div class="rsvp-card-message">${escapeHtml(r.message)}</div>` : ''}
        </div>
      `).join('');
    })
    .catch(() => {
      grid.innerHTML = '<div class="empty-state">Could not load RSVPs right now. Check back soon! 🐚</div>';
    });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const container = document.getElementById('sparkles');
  const icons = ['✨','⭐','🌟','💫'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${Math.random()*0.7+0.6}rem;animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*6}s;`;
    container.appendChild(s);
  }
</script>

</body>
</html>
